name: Build and Release EXE (pygame-battle)

on:
  push:
    tags :
      - 'spaceship-ships-v*.*.*'
    branches: [ "pygame-battle" ]
  pull_request:
    branches: [ "pygame-battle" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build EXE with PyInstaller
      run: |
        cd src
        pyinstaller main.py --onefile --name spaceship_game --add-data "../assets;assets" --add-data "../config/config.cfg;config" --paths=.
        cd ..
        mkdir dist_upload
        copy src\dist\spaceship_game.exe dist_upload\

    - name: Copy config and assets folders
      run: |
        Copy-Item config -Destination dist_upload\config -Recurse
        Copy-Item assets -Destination dist_upload\assets -Recurse
        Copy-Item sound  -Destination dist_upload\sound -Recurse
        Copy-Item font  -Destination dist_upload\font -Recurse

    - name: Zip the EXE and resources
      run: powershell Compress-Archive -Path dist_upload\* -DestinationPath spaceship_game.zip

    - name: Create GitHub Release and Upload
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.run_number }}
        tag_name: build-${{ github.run_number }}
        files: spaceship_game.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
