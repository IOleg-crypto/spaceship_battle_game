name: Spaceship Game EXE

on:
  push:
    tags:
      - 'spaceship_game'   

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
        if exist requirements.txt ( pip install -r requirements.txt )

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller main.py --onefile --name pygame-battle
        mkdir dist_upload
        copy dist\pygame-battle.exe dist_upload\

    - name: Zip the EXE
      run: powershell Compress-Archive -Path dist_upload\* -DestinationPath pygame-battle.zip

    - name: Create GitHub Release and Upload
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: pygame-battle.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

